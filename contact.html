    <!-- Dark Mode Flash Fix -->
    <script>
        (function() {
            const stored = localStorage.getItem('kezio-theme');
            if (stored === 'dark' || (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo-link">
                <img src="assets/icons/logo.png" alt="Kezio" class="logo-img" />
            </a>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                    <li><a href="support.html">Support</a></li>
                    <li><a href="https://karojunior.netlify.app" target="_blank">Dev</a></li>
                </ul>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <iconify-icon icon="material-symbols-light:light-mode-outline" class="theme-icon"></iconify-icon>
            </button>
        </div>
    </header>

    <!-- Mobile Drawer Overlay -->
    <div class="mobile-drawer-overlay" id="mobileDrawerOverlay"></div>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" id="mobileDrawer" role="dialog" aria-label="Navigation menu">
        <button class="mobile-drawer-close" id="drawerClose" aria-label="Close navigation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <ul class="mobile-drawer-nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="https://karojunior.netlify.app" target="_blank">Dev</a></li>
        </ul>
        <div class="mobile-drawer-theme">
            <span class="mobile-drawer-theme-label">Theme</span>
            <button class="mobile-theme-toggle" id="mobileThemeToggle">
                <iconify-icon icon="material-symbols-light:light-mode-outline" class="theme-icon"></iconify-icon>
                <span class="theme-label">Light</span>
            </button>
        </div>
    </div>

    <main>
        <section class="page-content">
            <div class="container">
                <h1>Contact</h1>

                <p class="contact-intro">If you have a question, idea, or bug report, I'd like to hear about it.</p>

                <form action="https://forx.voryn.xyz/f/3ewgomf" method="POST" class="contact-form">
                    <input type="hidden" name="_next" value="https://kezio.netlify.app/thank-you.html" />

                    <div class="form-group">
                        <label for="formName">Name</label>
                        <input type="text" id="formName" name="name" required class="form-input" />
                    </div>

                    <div class="form-group">
                        <label for="formEmail">Email</label>
                        <input type="email" id="formEmail" name="email" required class="form-input" />
                    </div>

                    <div class="form-group">
                        <label for="formTopic">Topic</label>
                        <select id="formTopic" name="topic" class="form-select">
                            <option value="Tool Request">Tool Request</option>
                            <option value="Bug Report">Bug Report</option>
                            <option value="Feedback">Feedback</option>
                            <option value="General Question">General Question</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="formMessage">Message</label>
                        <textarea id="formMessage" name="message" required class="form-textarea" rows="5"></textarea>
                    </div>

                    <button type="submit" class="button button-primary button-large">Send message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">

            <div class="footer-bottom">

                <p>Made by <a href="https://karojunior.netlify.app" target="_blank">Karo Junior</a></p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
